<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${provider.businessName})}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="detail-page">
    <div class="container">
        <nav class="breadcrumb" aria-label="Ubicación">
            <a th:href="@{/activities}">Actividades</a>
            <span aria-hidden="true">/</span>
            <span th:text="${provider.businessName}">Prestador</span>
        </nav>

        <!-- Encabezado del perfil -->
        <section class="profile-head">
            <span th:replace="~{fragments/avatar :: avatar(${provider}, 'lg')}"></span>
            <div class="profile-info">
                <span class="chip chip-cyan" th:text="${provider.typeLabel}">Persona física</span>
                <h1 th:text="${provider.businessName}">Emprendimiento</h1>
                <div class="rating" th:if="${averageRating != null}">
                    <span class="stars" th:attr="aria-label='Valoración ' + ${#numbers.formatDecimal(averageRating, 1, 'POINT', 1, 'COMMA')} + ' de 5'">
                        <span th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= filledStars} ? '★' : '☆'">★</span>
                    </span>
                    <strong th:text="${#numbers.formatDecimal(averageRating, 1, 'POINT', 1, 'COMMA')}">4,7</strong>
                    <span class="muted" th:text="'(' + ${reviewCount} + (${reviewCount} == 1 ? ' reseña)' : ' reseñas)')">(3 reseñas)</span>
                </div>
                <p class="muted" th:if="${provider.registrationDate != null}"
                   th:text="'En Uruguay Mnatural desde ' + ${#temporals.format(provider.registrationDate, 'MM/yyyy')}">Desde</p>
            </div>
        </section>

        <div class="detail-body">
            <div class="detail-main">
                <section class="detail-section" th:if="${provider.serviceDescription != null}">
                    <h2>Sobre el emprendimiento</h2>
                    <p th:text="${provider.serviceDescription}">Descripción</p>
                </section>

                <section class="detail-section">
                    <h2 th:text="'Actividades (' + ${#lists.size(activities)} + ')'">Actividades</h2>
                    <div class="activity-grid compact" th:unless="${#lists.isEmpty(activities)}">
                        <th:block th:each="activity : ${activities}">
                            <article th:replace="~{fragments/activity-card :: card(${activity})}"></article>
                        </th:block>
                    </div>
                    <p class="muted" th:if="${#lists.isEmpty(activities)}">Todavía no publicó actividades.</p>
                </section>

                <section class="detail-section">
                    <h2>Reseñas recientes</h2>
                    <p class="muted" th:if="${#lists.isEmpty(reviews)}">Todavía no tiene reseñas.</p>
                    <article class="review" th:each="review : ${reviews}">
                        <div class="review-head">
                            <a class="review-author" th:href="@{/tourists/{id}(id=${review.booking.tourist.id})}">
                                <span th:replace="~{fragments/avatar :: avatar(${review.booking.tourist}, 'sm')}"></span>
                                <strong th:text="${review.booking.tourist.firstName}">Nombre</strong>
                            </a>
                            <span class="stars small" th:attr="aria-label='Valoración ' + ${review.rating} + ' de 5'">
                                <span th:each="i : ${#numbers.sequence(1, 5)}" th:text="${i <= review.rating} ? '★' : '☆'">★</span>
                            </span>
                            <a th:href="@{/activities/{id}(id=${review.booking.availability.activity.id})}"
                               th:text="${review.booking.availability.activity.name}">Actividad</a>
                        </div>
                        <p th:text="${review.comment}">Comentario</p>
                    </article>
                </section>
            </div>

            <aside class="detail-side">
                <section class="detail-section">
                    <h2>Datos</h2>
                    <p class="location-lines">
                        <span class="muted">Dirección</span>
                        <span th:text="${provider.address}">Dirección</span>
                    </p>
                </section>
            </aside>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
