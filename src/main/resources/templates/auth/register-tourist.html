<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registro de turista')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page bg-montevideo">
    <div class="container">
        <div class="auth-card wide">
            <h1>Registro de turista</h1>
            <p class="subtitle">Creá tu cuenta para reservar actividades en todo el país.</p>

            <!-- th:object conecta el formulario con el TouristRegistrationForm del controller -->
            <form th:action="@{/register/tourist}" th:object="${form}" method="post" novalidate>

                <!-- Cartel general cuando hay algún dato mal (además del mensaje al lado de cada campo) -->
                <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}">
                    Hay datos que no son válidos. Revisá los campos marcados en rojo y volvé a enviar el formulario.
                </div>

                <fieldset>
                    <legend>Datos personales</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">Nombre</label>
                            <input type="text" id="firstName" th:field="*{firstName}" th:errorclass="is-invalid" autocomplete="given-name">
                            <p class="field-error" th:if="${#fields.hasErrors('firstName')}" th:text="${#fields.errors('firstName')[0]}"></p>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Apellido</label>
                            <input type="text" id="lastName" th:field="*{lastName}" th:errorclass="is-invalid" autocomplete="family-name">
                            <p class="field-error" th:if="${#fields.hasErrors('lastName')}" th:text="${#fields.errors('lastName')[0]}"></p>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email">
                            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></p>
                        </div>
                        <div class="form-group">
                            <label for="phone">Teléfono</label>
                            <input type="tel" id="phone" th:field="*{phone}" th:errorclass="is-invalid" placeholder="099 123 456" autocomplete="tel">
                            <p class="field-error" th:if="${#fields.hasErrors('phone')}" th:text="${#fields.errors('phone')[0]}"></p>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="idDocument">Cédula de identidad</label>
                        <input type="text" id="idDocument" th:field="*{idDocument}" th:errorclass="is-invalid" placeholder="1.234.567-8">
                        <p class="field-error" th:if="${#fields.hasErrors('idDocument')}" th:text="${#fields.errors('idDocument')[0]}"></p>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Contraseña</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                            <p class="hint">Mínimo 8 caracteres.</p>
                            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></p>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Repetir contraseña</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:text="${#fields.errors('confirmPassword')[0]}"></p>
                        </div>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary btn-block">Crear mi cuenta</button>
            </form>

            <p class="switch-link"><a th:href="@{/register}">← Volver</a> · ¿Ya tenés cuenta? <a th:href="@{/login}">Iniciá sesión</a></p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
