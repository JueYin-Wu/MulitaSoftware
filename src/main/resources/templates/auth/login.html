<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-page bg-casapueblo">
    <div class="container">
        <div class="auth-card">
            <h1>Iniciar sesión</h1>
            <p class="subtitle">Entrá con tu correo o tu nombre de usuario.</p>

            <!-- Mensajes según el parámetro que pone SecurityConfig en la URL -->
            <div class="alert alert-error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="alert alert-warning" th:if="${param.pending}">
                Tu cuenta de prestador todavía no está habilitada. Un administrador tiene que aprobar tu solicitud.
            </div>

            <!-- Spring Security recibe este POST en /login (no hay que programarlo) -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Correo o usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            </form>

            <p class="switch-link">¿No tenés una cuenta? <a th:href="@{/register}">Registrate</a></p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
