<!-- Header común. loggedIn, currentRole y currentUser los agrega GlobalModelAttributes en cada página. -->
<div th:fragment="header">
    <header class="site-header">
        <div class="container header-inner">
            <a th:href="@{/}" class="logo">
                <img th:src="@{/images/logo-uruguay-mnatural.png}" alt="Uruguay Mnatural">
            </a>

            <nav class="main-nav">
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/activities}">Actividades</a>
            </nav>

            <!-- Buscador: manda ?q=... a la página de actividades (ActivityController) -->
            <form th:action="@{/activities}" method="get" class="header-search" role="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
                </svg>
                <input type="text" name="q" th:value="${q}" placeholder="Buscar actividades..." aria-label="Buscar actividades">
            </form>

            <div class="header-actions">
                <!-- Visitante sin sesión -->
                <a th:unless="${loggedIn}" th:href="@{/login}" class="btn btn-primary btn-pill btn-sm">Ingresar</a>

                <!-- Usuario con sesión iniciada: botón celeste con su foto y su nombre.
                     Al tocarlo se despliega el menú con las opciones de su rol (user-menu.js lo cierra al tocar afuera). -->
                <details class="user-menu" th:if="${loggedIn and currentUser != null}">
                    <summary class="user-button">
                        <span class="user-avatar">
                            <img th:if="${currentUser.profileImageUrl != null}" th:src="@{${currentUser.profileImageUrl}}" alt="">
                            <span th:unless="${currentUser.profileImageUrl != null}" th:text="${currentUser.personInitials}">EP</span>
                        </span>
                        <span class="user-name" th:text="${currentUser.fullName}">Nombre Apellido</span>
                        <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </summary>

                    <div class="user-dropdown">
                        <div class="user-dropdown-head">
                            <strong th:text="${currentUser.fullName}">Nombre Apellido</strong>
                            <span th:text="'@' + ${currentUser.username} + ' · ' + (${currentRole == 'ADMIN'} ? 'Administrador' : (${currentRole == 'PROVIDER'} ? 'Prestador' : 'Turista'))">@usuario · Turista</span>
                        </div>

                        <th:block th:if="${currentRole == 'TOURIST'}">
                            <a th:href="@{/tourist}">Mi perfil</a>
                            <a th:href="@{/tourist/bookings}">Mis reservas</a>
                        </th:block>

                        <th:block th:if="${currentRole == 'PROVIDER'}">
                            <a th:href="@{/provider}">Mi portal</a>
                            <a th:href="@{/provider/activities}">Mis actividades</a>
                            <a th:href="@{/providers/{id}(id=${currentUser.id})}">Mi perfil público</a>
                        </th:block>

                        <th:block th:if="${currentRole == 'ADMIN'}">
                            <a th:href="@{/admin/providers}">Prestadores</a>
                            <a th:href="@{/admin/tags}">Tipos de actividad</a>
                            <a th:href="@{/admin/equipment}">Equipamiento</a>
                        </th:block>

                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="user-logout">Cerrar sesión</button>
                        </form>
                    </div>
                </details>
            </div>
        </div>
    </header>
    <script th:src="@{/js/user-menu.js}" defer></script>
</div>
