<!-- Fragmento con el <head> común a todas las páginas. Se usa así:
     <head th:replace="~{fragments/head :: head('Título')}"></head> -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Uruguay Mnatural'">Uruguay Mnatural</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Ícono de la pestaña (favicon): la "M" celeste del logo -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/favicon-32.png}">
    <link rel="icon" th:href="@{/favicon.ico}" sizes="any">
    <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
