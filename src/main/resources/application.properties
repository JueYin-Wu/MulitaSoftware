spring.application.name=porytic2026

# Puerto de la página: http://localhost:8081
# (no se usa el 8080 porque en algunas computadoras lo ocupa el servidor web que instala PostgreSQL de EDB)
server.port=${PORT:8081}

# Base de datos PostgreSQL (se levanta con "docker compose up -d", ver docker-compose.yml).
# Los valores entre ${...:...} se pueden cambiar con variables de entorno; si no, se usa lo que va después de ":".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/mnatural}
spring.datasource.username=${DB_USER:mnatural}
spring.datasource.password=${DB_PASSWORD:mnatural}

# Hibernate crea las tablas que falten y agrega columnas nuevas, sin borrar los datos.
# (Si se cambia mucho una entidad y algo no cierra: "docker compose down -v" y volver a arrancar.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# API REST: clave secreta para firmar los tokens JWT (mínimo 32 caracteres) y cuánto dura cada token.
# En producción la clave se pasa con la variable de entorno JWT_SECRET y no se sube al repositorio.
app.jwt.secret=${JWT_SECRET:uruguay-mnatural-clave-de-desarrollo-cambiar-en-produccion}
app.jwt.expiration-minutes=60

# Mercado Pago (pago de las reservas con tarjeta DENTRO de nuestra página: Checkout API + Card Payment Brick).
# El Access Token es secreto y NO se sube a Git: va en el archivo secrets.properties (raíz del proyecto,
# ignorado por Git; ver secrets.properties.example) o en la variable de entorno MP_ACCESS_TOKEN.
spring.config.import=optional:file:./secrets.properties
app.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# Clave pública: la usa el formulario de tarjeta en la página (no es secreta, pero se carga junto al token)
app.mercadopago.public-key=${MP_PUBLIC_KEY:}
app.mercadopago.api-url=https://api.mercadopago.com
# Tiempo máximo de espera de una respuesta de Mercado Pago (si no contesta, se avisa que no está disponible)
app.mercadopago.timeout-seconds=10
# Modo de prueba: muestra en la página de pago cómo usar las tarjetas de prueba
app.mercadopago.test-mode=true
# Dirección pública de la página. Con localhost, Mercado Pago no puede mandar avisos (webhook):
# en ese caso la página consulta el estado del pago directamente a la API.
app.public-url=${APP_PUBLIC_URL:http://localhost:8081}

# Clima (Open-Meteo, API pública y gratuita, sin clave): pronóstico para la fecha y el lugar de la actividad
app.weather.enabled=true
app.weather.api-url=https://api.open-meteo.com
app.weather.timezone=America/Montevideo
app.weather.timeout-seconds=4
app.weather.cache-minutes=60

# Recuperar contraseña: mientras no se envien correos, mostrar el enlace en pantalla (poner false en produccion)
app.reset.show-link=true

# Pone entre comillas las columnas cuyo nombre es palabra reservada de SQL (por ejemplo "date" o "time")
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Fotos que suben los usuarios: carpeta donde se guardan y tamaño máximo
app.uploads.folder=uploads
spring.servlet.multipart.max-file-size=10MB
# El pedido completo puede traer varias fotos (por ejemplo, las 5 fotos de una actividad nueva)
spring.servlet.multipart.max-request-size=55MB
