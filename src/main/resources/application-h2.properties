# Perfil "h2": la base vieja en memoria, para probar algo rápido sin Docker.
# Se activa en IntelliJ: Run > Edit Configurations > Active profiles: h2
# Ojo: con este perfil los datos se borran cada vez que se reinicia la aplicación.
spring.datasource.url=jdbc:h2:mem:mnatural
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
